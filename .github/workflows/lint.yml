name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check
        run: bash -n ha-chromium-kiosk-setup.sh

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning
          # SC2154 (var referenced but not assigned) is expected and
          # documented as safe for this script: prompt_user() assigns
          # its result variables via `declare -g`, which ShellCheck
          # cannot trace through - see the comment in prompt_user()
          # and issue #26. Disabling just that check rather than
          # raising the whole severity threshold, so real new warnings
          # still fail the build.
          additional_files: ''
        env:
          SHELLCHECK_OPTS: -e SC2154

  integration:
    runs-on: ubuntu-latest
    # Level 4 (TESTING.md) - real systemd install/uninstall against a
    # genuine PID 1, not a bare container. Automates part of issue #31's
    # gap (Level 4 was previously manual-only). Does NOT cover the kiosk
    # GUI/Chromium rendering itself - see TESTING.md's "not covered"
    # section for why that's out of scope for a container-based runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run integration test suite
        run: bash tests/run-integration-tests.sh
